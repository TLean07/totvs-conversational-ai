version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    # O HuggingFace e o Dockerfile atualmente expoem a porta 7860
    ports:
      - "8000:7860"
    environment:
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      - AI_SERVICE_REQUIRE_TOKEN=true
      - AI_CORS_ALLOWED_ORIGINS=http://backend:8080,http://localhost:8080
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-manual}
      - PARAKEET_ENABLED=${PARAKEET_ENABLED:-false}
      - PARAKEET_MODEL=${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      - PARAKEET_DEVICE=${PARAKEET_DEVICE:-auto}
      - PARAKEET_MAX_AUDIO_MB=${PARAKEET_MAX_AUDIO_MB:-100}
      - PARAKEET_MAX_DURATION_SECONDS=${PARAKEET_MAX_DURATION_SECONDS:-3600}
      - PARAKEET_LANGUAGE=${PARAKEET_LANGUAGE:-pt}
      - PARAKEET_USE_TIMESTAMPS=${PARAKEET_USE_TIMESTAMPS:-false}
      - PARAKEET_CACHE_DIR=${PARAKEET_CACHE_DIR:-}
    restart: unless-stopped
    networks:
      - totvs-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Conecta ao Mongo externo (Atlas) usando a variavel do .env
      - MONGODB_URI=${MONGODB_URI}
      # Conecta ao ai-service atraves do nome do container na rede interna (totvs-net)
      - AI_SERVICE_URL=http://ai-service:7860
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      - PARAKEET_MAX_AUDIO_MB=${PARAKEET_MAX_AUDIO_MB:-100}
      - PARAKEET_MAX_DURATION_SECONDS=${PARAKEET_MAX_DURATION_SECONDS:-3600}
      - PARAKEET_LANGUAGE=${PARAKEET_LANGUAGE:-pt}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE:-false}
      - APP_COOKIE_SAME_SITE=${APP_COOKIE_SAME_SITE:-Lax}
      # Permite CORS tanto local quanto pro IP publico da maquina
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost,http://${SERVER_IP},http://${SERVER_IP}:3000
    restart: unless-stopped
    depends_on:
      - ai-service
    networks:
      - totvs-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passa o endereco publico da API pro cache do Next.js
        - NEXT_PUBLIC_API_URL=http://${SERVER_IP}:8080/api
    ports:
      # Mapeia a porta 80 do host (padrao HTTP) para a 3000 do container
      - "80:3000"
      # Extra: Opcionalmente deixa disponivel na 3000
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - totvs-net

networks:
  totvs-net:
    driver: bridge
