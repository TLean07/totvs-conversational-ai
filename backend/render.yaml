services:
  - type: web
    name: challenge-totvs-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_COOKIE_SAME_SITE
        value: "None"
      - key: AI_SERVICE_TOKEN
        sync: false
      - key: AI_SERVICE_MAX_RETRIES
        value: "1"
      - key: PARAKEET_MAX_AUDIO_MB
        value: "100"
      - key: PARAKEET_MAX_DURATION_SECONDS
        value: "3600"
      - key: PARAKEET_LANGUAGE
        value: "pt"
