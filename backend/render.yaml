services:
  - type: web
    name: challenge-totvs-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
