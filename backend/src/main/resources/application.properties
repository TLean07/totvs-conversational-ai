# ===========================================
# Challenge TOTVS - Conversational Intelligence
# ===========================================

# Server
server.port=${PORT:8080}

# Oracle Database (env vars sobrescrevem em producao)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RM559471}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SUA_SENHA_AQUI}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true

# Microsservico de IA (Python - FastAPI)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# CORS - Vercel + localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://challenge-totvs.vercel.app}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
