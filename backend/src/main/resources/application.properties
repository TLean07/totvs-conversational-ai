# ===========================================
# Challenge TOTVS - Conversational Intelligence
# ===========================================

# Server
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript

# Oracle Database (FIAP) - credenciais somente via variaveis de ambiente
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# O usuario FIAP permite 20 sessoes e derruba sessao ociosa em 30 min: pool pequeno com rotacao
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate - o schema e criado pelo script db/oracle/schema.sql (SQL Developer / SQLcl)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Cache (Caffeine, em memoria): leituras repetidas do dashboard, listas e alertas nao voltam ao Oracle
# dentro da janela; qualquer escrita (criar, importar, reprocessar, apagar, alerta, feedback) limpa tudo.
spring.cache.type=caffeine
spring.cache.cache-names=dashboard,transcricoes,transcricao,insights,alertas,usuarios,leania-contexto
spring.cache.caffeine.spec=maximumSize=${CACHE_MAX_ENTRIES:1000},expireAfterWrite=${CACHE_TTL_SECONDS:120}s

# Security
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_ACCESS_TOKEN_MINUTES:15}
app.refresh-token-days=${APP_REFRESH_TOKEN_DAYS:14}
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrador}

# Microsservico de IA (Python - FastAPI)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.max-retries=${AI_SERVICE_MAX_RETRIES:1}

# Analise assincrona: threads < pool Oracle (sobra conexao para a API); recuperacao de PROCESSANDO presos
analysis.threads=${ANALYSIS_THREADS:2}
analysis.queue-capacity=${ANALYSIS_QUEUE_CAPACITY:10000}
analysis.recovery-interval-ms=${ANALYSIS_RECOVERY_INTERVAL_MS:180000}

# Keep-alive mutuo com a LeanIA (planos gratuitos hibernam sem trafego). Ver KeepAliveScheduler.
keepalive.enabled=${KEEPALIVE_ENABLED:true}
keepalive.url=${KEEPALIVE_URL:}
keepalive.interval-ms=${KEEPALIVE_INTERVAL_MS:600000}

# Transcricao de audio opcional via ai-service / Parakeet
transcription.max-audio-mb=${PARAKEET_MAX_AUDIO_MB:100}
transcription.max-duration-seconds=${PARAKEET_MAX_DURATION_SECONDS:3600}
transcription.language=${PARAKEET_LANGUAGE:pt}

# CORS - Vercel + localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://challenge-totvs.vercel.app}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload de arquivos JSON TOTVS e audio de reuniao
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:100MB}

# Logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n
