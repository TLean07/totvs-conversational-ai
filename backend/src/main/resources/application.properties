# ===========================================
# Challenge TOTVS - Conversational Intelligence
# ===========================================

# Server
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/challenge-totvs}
spring.data.mongodb.auto-index-creation=true

# Security
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-minutes=${APP_ACCESS_TOKEN_MINUTES:15}
app.refresh-token-days=${APP_REFRESH_TOKEN_DAYS:14}
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrador}

# Microsservico de IA (Python - FastAPI)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.max-retries=${AI_SERVICE_MAX_RETRIES:1}

# Transcricao de audio opcional via ai-service / Parakeet
transcription.max-audio-mb=${PARAKEET_MAX_AUDIO_MB:100}
transcription.max-duration-seconds=${PARAKEET_MAX_DURATION_SECONDS:3600}
transcription.language=${PARAKEET_LANGUAGE:pt}

# CORS - Vercel + localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://challenge-totvs.vercel.app}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload de arquivos JSON TOTVS e audio de reuniao
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:100MB}

# Logging
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n
